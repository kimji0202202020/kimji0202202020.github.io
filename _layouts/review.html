---
layout: default
---
<article>
  <h1 class="entry-title">{{ page.title }}</h1>
  <p class="entry-meta">
    {{ page.creator_label | default: "by" }} {{ page.creator }}{% if page.date %} · {{ page.date | date: "%Y-%m-%d" }}{% endif %}
    · <span class="tag">{{ page.genre }}</span>
    · <span class="rating">{{ page.rating }}</span>
  </p>
  {{ content }}
</article>

<hr>
<p><a href="{{ '/' | append: page.section | append: '/' | relative_url }}">&larr; {{ page.section | capitalize }} 목록으로</a></p>
