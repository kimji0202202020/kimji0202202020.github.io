<header class="site-header">
  <img class="site-portrait" src="{{ '/assets/images/portrait.jpg' | relative_url }}" alt="{{ site.author }}의 프로필 사진">
  <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
  <p class="site-tagline">{{ site.tagline }}</p>
  <nav aria-label="주 메뉴">
    <ul class="site-nav">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
      <li><a href="{{ '/journal/' | relative_url }}"{% if page.section == 'journal' %} aria-current="page"{% endif %}>Journal</a></li>
      <li><a href="{{ '/films/' | relative_url }}"{% if page.section == 'films' %} aria-current="page"{% endif %}>Films</a></li>
      <li><a href="{{ '/music/' | relative_url }}"{% if page.section == 'music' %} aria-current="page"{% endif %}>Music</a></li>
    </ul>
  </nav>
</header>
